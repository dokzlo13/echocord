resolver = "2"

[workspace.package]
edition = "2024"
version = "0.4.0"
publish = false
license = "MIT"
repository = "https://github.com/dokzlo13/echocord"

[patch.crates-io]
libopus_sys = { path = ".cache/libopus_sys-0.3.3" }
