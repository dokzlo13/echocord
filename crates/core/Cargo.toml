[package]
name = "echocord-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "=6.0.0"
ts-rs = "=12.0.1"
rtrb = "=0.4.0"
rubato = "=0.16.2"
symphonia-core = "=0.5.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std"] }

[target.'cfg(windows)'.dependencies]
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
cpal = "=0.18.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security"] }
windows-core = "=0.62.2"
opus2 = { version = "=0.4.0", features = ["bundled"] }
songbird = { version = "=0.6.0", default-features = false, features = ["driver", "gateway", "serenity", "rustls", "tungstenite"] }
serenity = { version = "=0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend", "voice"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["pcm"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
